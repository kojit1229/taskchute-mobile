<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="タスクシュート">
<meta name="theme-color" content="#1a1a1a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>タスクシュート Mobile</title>
</head>
<body>

<!-- トップバー -->
<header class="topbar">
  <div class="topbar-left">
    <span class="date-label" id="date-label">—</span>
    <span class="sync-status" id="sync-status"></span>
  </div>
  <div class="topbar-right">
    <button class="icon-btn" id="btn-load" title="データ読込">📂</button>
    <button class="icon-btn" id="btn-save" title="変更を書き出し">💾<span class="badge" id="edits-badge" hidden>0</span></button>
  </div>
</header>

<!-- 初回案内 -->
<section id="welcome" class="welcome">
  <h2>📱 タスクシュート Mobile</h2>
  <p>PC アプリで書き出した <code>latest.json</code> を読み込んでください。</p>
  <ol class="steps">
    <li>PC 側で「📤 iPhone用データを書き出す」を実行</li>
    <li>iCloud Drive で同期を確認</li>
    <li>下の「データを読み込む」をタップ</li>
    <li>「ファイル」アプリで <code>taskchute-sync/exports/latest.json</code> を選択</li>
  </ol>
  <button class="primary-btn" id="btn-load-welcome">📂 データを読み込む</button>
</section>

<!-- タブ -->
<nav class="tabs" id="tabs" hidden>
  <button class="tab active" data-tab="tasks">
    <span class="tab-label">タスク</span>
    <span class="tab-count" id="tab-tasks-count">0</span>
  </button>
  <button class="tab" data-tab="routines">
    <span class="tab-label">ルーティン</span>
    <span class="tab-count" id="tab-routines-count">0</span>
  </button>
  <button class="tab" data-tab="plans">
    <span class="tab-label">予定</span>
    <span class="tab-count" id="tab-plans-count">0</span>
  </button>
</nav>

<!-- メインコンテンツ -->
<main id="main" hidden>

  <!-- タスクパネル -->
  <section class="panel" id="panel-tasks">
    <div id="tasks-list"></div>
    <button class="add-btn" id="btn-add-task">+ タスク追加</button>
  </section>

  <!-- ルーティンパネル -->
  <section class="panel" id="panel-routines" hidden>
    <div id="routines-list"></div>
  </section>

  <!-- 予定パネル -->
  <section class="panel" id="panel-plans" hidden>
    <div id="plans-list"></div>
    <button class="add-btn" id="btn-add-plan">+ 予定追加</button>
  </section>

</main>

<!-- フッター -->
<footer class="footer" id="footer" hidden>
  <button class="save-btn" id="btn-save-bottom">💾 変更を書き出し (<span id="edits-count-bottom">0</span>)</button>
</footer>

<!-- ===== 詳細モーダル: タスク ===== -->
<div class="modal modal-fullscreen" id="modal-task" hidden>
  <div class="modal-fullscreen-inner">
    <header class="modal-header">
      <button class="modal-close" data-action="close-modal">✕</button>
      <h3 id="task-modal-title">タスク詳細</h3>
      <button class="modal-action-btn" id="btn-task-delete" hidden>🗑</button>
    </header>
    <div class="modal-body">
      <label class="check-row">
        <input type="checkbox" id="task-completed">
        <span>完了</span>
      </label>
      <label>タスク名 <span class="required">*</span>
        <input type="text" id="task-name" placeholder="例: 買い物">
      </label>
      <div class="row">
        <label>予定開始
          <input type="time" id="task-plan-start">
        </label>
        <label>予定終了
          <input type="time" id="task-plan-end">
        </label>
      </div>
      <div class="row">
        <label>実績開始
          <input type="time" id="task-actual-start">
        </label>
        <label>実績終了
          <input type="time" id="task-actual-end">
        </label>
      </div>
      <label>見積時間
        <input type="text" id="task-estimate" placeholder="例: 30分">
      </label>
      <label>カテゴリー
        <select id="task-category">
          <option value="">（未分類）</option>
        </select>
      </label>
      <div class="row">
        <label>⚡ 充電
          <select id="task-charge">
            <option value="0">なし</option>
            <option value="1">⚡ 小</option>
            <option value="2">⚡⚡ 中</option>
            <option value="3">⚡⚡⚡ 大</option>
          </select>
        </label>
        <label>⚡ 放電
          <select id="task-discharge">
            <option value="0">なし</option>
            <option value="1">⚡ 小</option>
            <option value="2">⚡⚡ 中</option>
            <option value="3">⚡⚡⚡ 大</option>
          </select>
        </label>
      </div>
      <label>コメント
        <textarea id="task-comment" rows="3"></textarea>
      </label>
    </div>
    <footer class="modal-footer">
      <button class="primary-btn" id="btn-task-save">保存</button>
    </footer>
  </div>
</div>

<!-- ===== 詳細モーダル: 予定 ===== -->
<div class="modal modal-fullscreen" id="modal-plan" hidden>
  <div class="modal-fullscreen-inner">
    <header class="modal-header">
      <button class="modal-close" data-action="close-modal">✕</button>
      <h3 id="plan-modal-title">予定詳細</h3>
    </header>
    <div class="modal-body">
      <label>タイトル <span class="required">*</span>
        <input type="text" id="plan-title" placeholder="例: 打ち合わせ">
      </label>
      <div class="row">
        <label>予定開始
          <input type="time" id="plan-start">
        </label>
        <label>予定終了
          <input type="time" id="plan-end">
        </label>
      </div>
      <div class="row">
        <label>実績開始
          <input type="time" id="plan-actual-start">
        </label>
        <label>実績終了
          <input type="time" id="plan-actual-end">
        </label>
      </div>
      <label>ラベル
        <select id="plan-label">
          <option value="">（なし）</option>
        </select>
      </label>
      <label>カテゴリー
        <select id="plan-category">
          <option value="">（未分類）</option>
        </select>
      </label>
      <div class="row">
        <label>⚡ 充電
          <select id="plan-charge">
            <option value="0">なし</option>
            <option value="1">⚡ 小</option>
            <option value="2">⚡⚡ 中</option>
            <option value="3">⚡⚡⚡ 大</option>
          </select>
        </label>
        <label>⚡ 放電
          <select id="plan-discharge">
            <option value="0">なし</option>
            <option value="1">⚡ 小</option>
            <option value="2">⚡⚡ 中</option>
            <option value="3">⚡⚡⚡ 大</option>
          </select>
        </label>
      </div>
      <label>メモ
        <textarea id="plan-comment" rows="3"></textarea>
      </label>
    </div>
    <footer class="modal-footer">
      <button class="primary-btn" id="btn-plan-save">保存</button>
    </footer>
  </div>
</div>

<!-- ===== トースト ===== -->
<div class="toast" id="toast" hidden></div>

<!-- ファイル選択（非表示） -->
<input type="file" id="file-input" accept=".json,application/json" hidden>

<script src="app.js"></script>
</body>
</html>
